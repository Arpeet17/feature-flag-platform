server {
    listen 80;
    root /usr/share/nginx/html;

    # SSE: disable buffering so flag changes reach SDKs immediately, and keep connections open.
    location /api/v1/sdk/stream {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location ~ ^/(api|swagger-ui|v3/api-docs|actuator)(/|$) {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /swagger-ui.html {
        proxy_pass http://backend:8080;
    }

    # Fingerprinted assets can be cached forever; index.html must always revalidate.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
