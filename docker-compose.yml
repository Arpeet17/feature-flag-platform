# One-command local stack: PostgreSQL + API + dashboard.
#   docker compose up --build
# Dashboard: http://localhost:3000  (admin@ffp.local / admin123)
# API docs:  http://localhost:8080/swagger-ui.html
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ffp
      POSTGRES_USER: ffp
      POSTGRES_PASSWORD: ffp
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ffp -d ffp"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FFP_DB_URL: jdbc:postgresql://postgres:5432/ffp
      FFP_DB_USER: ffp
      FFP_DB_PASSWORD: ffp
      FFP_JWT_SECRET: ${FFP_JWT_SECRET:-local-compose-secret-please-change-0123456789}
      FFP_ADMIN_PASSWORD: ${FFP_ADMIN_PASSWORD:-admin123}
      FFP_DEMO_DATA: "true"
      FFP_CORS_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:
